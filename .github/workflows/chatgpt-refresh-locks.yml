name: Temporary final lock refresh

on:
  push:
    branches:
      - chatgpt/final-stability-audit-fixes-2026-08-12

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh project blob locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path.cwd()

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + b"\0" + data
              ).hexdigest()

          def refresh_local_locks(value) -> int:
              changed = 0
              if isinstance(value, dict):
                  rel = value.get("path")
                  if isinstance(rel, str) and "git_blob_sha" in value:
                      target = root / rel
                      if target.is_file():
                          observed = git_blob_sha(target)
                          if value.get("git_blob_sha") != observed:
                              value["git_blob_sha"] = observed
                              changed += 1
                  for child in value.values():
                      changed += refresh_local_locks(child)
              elif isinstance(value, list):
                  for child in value:
                      changed += refresh_local_locks(child)
              return changed

          p406 = root / ".src/.configs/p4.06-runtime-evidence-gate-policy.json"
          p406_data = json.loads(p406.read_text(encoding="utf-8"))
          refresh_local_locks(p406_data)
          p406.write_text(json.dumps(p406_data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          final = root / ".src/.configs/final-stability-policy.json"
          final_data = json.loads(final.read_text(encoding="utf-8"))
          refresh_local_locks(final_data)
          final.write_text(json.dumps(final_data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          mismatches = []
          for cfg in sorted((root / ".src/.configs").rglob("*.json")):
              data = json.loads(cfg.read_text(encoding="utf-8"))
              stack = [data]
              while stack:
                  item = stack.pop()
                  if isinstance(item, dict):
                      rel = item.get("path")
                      expected = item.get("git_blob_sha")
                      if isinstance(rel, str) and isinstance(expected, str):
                          target = root / rel
                          if target.is_file():
                              observed = git_blob_sha(target)
                              if observed != expected:
                                  mismatches.append((str(cfg.relative_to(root)), rel, expected, observed))
                      stack.extend(item.values())
                  elif isinstance(item, list):
                      stack.extend(item)
          if mismatches:
              for mismatch in mismatches:
                  print("LOCK_MISMATCH", *mismatch)
              raise SystemExit("project-local blob-lock graph is not closed")
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/chatgpt-refresh-locks.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh final stability integrity locks"
      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd()
          for path in sorted((root / ".src/.configs").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
          for path in sorted((root / ".src/.tools").rglob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find .src/.tools -type f -name '*.sh' -print0)
          test "$(find .src/.patches -maxdepth 1 -type f -name '*.patch' | wc -l)" -eq 5
          ! compgen -G '.src/.patches/0006-*.patch' >/dev/null
          ! grep -RIn --exclude-dir=.git 'REPLACE_' .src .docs >/dev/null
      - name: Push final lock refresh
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:chatgpt/final-stability-audit-fixes-2026-08-12
