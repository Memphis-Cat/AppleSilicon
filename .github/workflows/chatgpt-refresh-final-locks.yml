name: ChatGPT Refresh Final Locks

on:
  push:
    branches:
      - chatgpt/final-stability-audit-fixes-2026-08-12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/final-stability-audit-fixes-2026-08-12
          submodules: recursive
          fetch-depth: 0
      - name: Refresh integrity locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path

          root = Path('.').resolve()

          def blob_sha(path: Path) -> str:
              b = path.read_bytes()
              return hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest()

          p406 = root / '.src/.configs/p4.06-runtime-evidence-policy.json'
          data = json.loads(p406.read_text())
          for item in data.get('locked_project_artifacts', []):
              p = root / item['path']
              if p.is_file():
                  item['git_blob_sha'] = blob_sha(p)
          p406.write_text(json.dumps(data, indent=2) + '\n')

          finalp = root / '.src/.configs/final-stability-policy.json'
          data = json.loads(finalp.read_text())
          for item in data.get('locked_project_artifacts', []):
              p = root / item['path']
              if p.is_file():
                  item['git_blob_sha'] = blob_sha(p)
          finalp.write_text(json.dumps(data, indent=2) + '\n')
          PY

          rm -f .github/workflows/chatgpt-refresh-final-locks.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh final stability locks after audit fixes'
            git push origin HEAD:chatgpt/final-stability-audit-fixes-2026-08-12
          fi
